<svg viewBox="0 0 40 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <circle cx="20" cy="15" r="8" fill="#FFD3B6" />
  
  <!-- Hair - Male family member -->
  <path d="M12 15 C 12 10 16 7 20 7 C 24 7 28 10 28 15" fill="#4E342E" />
  
  <!-- Body - Formal shirt -->
  <rect x="13" y="23" width="14" height="25" fill="#1976D2" />
  
  <!-- Arms - clapping -->
  <rect x="8" y="27" width="8" height="4" fill="#FFD3B6" rx="2" transform="rotate(-20 8 27)" />
  <rect x="24" y="27" width="8" height="4" fill="#FFD3B6" rx="2" transform="rotate(20 32 27)" />
  
  <!-- Hands clapping -->
  <circle cx="14" cy="29" r="2" fill="#FFD3B6" class="left-hand" />
  <circle cx="26" cy="29" r="2" fill="#FFD3B6" class="right-hand" />
  
  <!-- Legs -->
  <rect x="15" y="48" width="4" height="15" fill="#424242" />
  <rect x="21" y="48" width="4" height="15" fill="#424242" />
  
  <!-- Shoes -->
  <rect x="14" y="63" width="6" height="2" fill="#212121" rx="1" />
  <rect x="20" y="63" width="6" height="2" fill="#212121" rx="1" />
  
  <!-- Face details - happy expression with glasses -->
  <circle cx="17" cy="13" r="1" fill="#3E2723" />
  <circle cx="23" cy="13" r="1" fill="#3E2723" />
  <path d="M17 18 Q20 20 23 18" stroke="#3E2723" fill="transparent" stroke-width="0.7" />
  
  <!-- Glasses -->
  <rect x="15" y="12" width="4" height="3" fill="transparent" stroke="#212121" stroke-width="0.5" rx="1" />
  <rect x="21" y="12" width="4" height="3" fill="transparent" stroke="#212121" stroke-width="0.5" rx="1" />
  <line x1="19" y1="13.5" x2="21" y2="13.5" stroke="#212121" stroke-width="0.5" />
</svg>