<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="5" fill="#FF4081" />
  
  <!-- Explosion rays - long -->
  <line x1="50" y1="50" x2="50" y2="10" stroke="#FF4081" stroke-width="2" />
  <line x1="50" y1="50" x2="50" y2="90" stroke="#FF4081" stroke-width="2" />
  <line x1="50" y1="50" x2="10" y2="50" stroke="#FF4081" stroke-width="2" />
  <line x1="50" y1="50" x2="90" y2="50" stroke="#FF4081" stroke-width="2" />
  
  <!-- Explosion rays - diagonal long -->
  <line x1="50" y1="50" x2="15" y2="15" stroke="#FF4081" stroke-width="2" />
  <line x1="50" y1="50" x2="85" y2="15" stroke="#FF4081" stroke-width="2" />
  <line x1="50" y1="50" x2="15" y2="85" stroke="#FF4081" stroke-width="2" />
  <line x1="50" y1="50" x2="85" y2="85" stroke="#FF4081" stroke-width="2" />
  
  <!-- Explosion rays - short -->
  <line x1="50" y1="50" x2="60" y2="30" stroke="#FF4081" stroke-width="1.5" />
  <line x1="50" y1="50" x2="40" y2="30" stroke="#FF4081" stroke-width="1.5" />
  <line x1="50" y1="50" x2="60" y2="70" stroke="#FF4081" stroke-width="1.5" />
  <line x1="50" y1="50" x2="40" y2="70" stroke="#FF4081" stroke-width="1.5" />
  <line x1="50" y1="50" x2="30" y2="60" stroke="#FF4081" stroke-width="1.5" />
  <line x1="50" y1="50" x2="30" y2="40" stroke="#FF4081" stroke-width="1.5" />
  <line x1="50" y1="50" x2="70" y2="60" stroke="#FF4081" stroke-width="1.5" />
  <line x1="50" y1="50" x2="70" y2="40" stroke="#FF4081" stroke-width="1.5" />
  
  <!-- Sparkles -->
  <circle cx="20" cy="20" r="2" fill="#FF4081" />
  <circle cx="80" cy="20" r="2" fill="#FF4081" />
  <circle cx="20" cy="80" r="2" fill="#FF4081" />
  <circle cx="80" cy="80" r="2" fill="#FF4081" />
  <circle cx="35" cy="25" r="1.5" fill="#FF4081" />
  <circle cx="65" cy="25" r="1.5" fill="#FF4081" />
  <circle cx="35" cy="75" r="1.5" fill="#FF4081" />
  <circle cx="65" cy="75" r="1.5" fill="#FF4081" />
</svg>