<svg viewBox="0 0 40 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <circle cx="20" cy="15" r="8" fill="#FFD3B6" />
  
  <!-- Hair -->
  <path d="M12 15 C 12 10 16 7 20 7 C 24 7 28 10 28 15" fill="#8D6E63" />
  
  <!-- Body - Cute Outfit -->
  <rect x="13" y="23" width="14" height="20" fill="#64B5F6" rx="2" />
  
  <!-- Arms - in clapping position -->
  <rect x="8" y="25" width="5" height="4" fill="#FFD3B6" rx="2" transform="rotate(-15 8 25)" />
  <rect x="27" y="25" width="5" height="4" fill="#FFD3B6" rx="2" transform="rotate(15 32 25)" />
  
  <!-- Hands clapping -->
  <circle cx="13" cy="26" r="2" fill="#FFD3B6" class="left-hand" />
  <circle cx="27" cy="26" r="2" fill="#FFD3B6" class="right-hand" />
  
  <!-- Legs -->
  <rect x="15" y="43" width="4" height="15" fill="#90CAF9" />
  <rect x="21" y="43" width="4" height="15" fill="#90CAF9" />
  
  <!-- Shoes -->
  <rect x="14" y="58" width="6" height="2" fill="#3F51B5" rx="1" />
  <rect x="20" y="58" width="6" height="2" fill="#3F51B5" rx="1" />
  
  <!-- Face details -->
  <circle cx="17" cy="13" r="1" fill="#3E2723" />
  <circle cx="23" cy="13" r="1" fill="#3E2723" />
  <path d="M17 18 Q20 20 23 18" stroke="#3E2723" fill="transparent" stroke-width="0.7" />
</svg>