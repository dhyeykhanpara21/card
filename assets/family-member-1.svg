  <circle cx="20" cy="15" r="8" fill="#FFD3B6" />
  
  <!-- Hair - Older female family member -->
  <path d="M12 15 C 12 10 16 7 20 7 C 24 7 28 10 28 15" fill="#9E9E9E" />
  <path d="M12 15 Q 16 5 20 5 Q 24 5 28 15" fill="#9E9E9E" />
  
  <!-- Body - Dress -->
  <path d="M13 23 L27 23 L29 48 L11 48 Z" fill="#6A1B9A" />
  
  <!-- Arms - clapping -->
  <rect x="9" y="27" width="8" height="4" fill="#FFD3B6" rx="2" transform="rotate(-20 9 27)" />
  <rect x="23" y="27" width="8" height="4" fill="#FFD3B6" rx="2" transform="rotate(20 31 27)" />
  
  <!-- Hands clapping -->
  <circle cx="15" cy="29" r="2" fill="#FFD3B6" class="left-hand" />
  <circle cx="25" cy="29" r="2" fill="#FFD3B6" class="right-hand" />
  
  <!-- Legs -->
  <rect x="15" y="48" width="4" height="15" fill="#FFD3B6" />
  <rect x="21" y="48" width="4" height="15" fill="#FFD3B6" />
  
